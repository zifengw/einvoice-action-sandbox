name: Validate e-invoices
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate invoices offline
        id: check
        uses: wsystemdev/einvoice-validate-action@v0
        with:
          files: |
            invoices/**/*.xml
            invoices/**/*.pdf
          rules: auto
          fail-on: error
